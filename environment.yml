name: arabic-abstracts
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.11
  - pip

  # Core packages
  - pandas=2.2.2
  - numpy=1.26.4
  - matplotlib=3.8.4
  - seaborn=0.13.2
  - plotly=5.22.0
  - scikit-learn=1.5.1
  - scipy=1.13.1
  - tqdm=4.66.4
  - tabulate=0.9.0
  - joblib=1.4.2
  - regex=2024.5.15
  - requests=2.32.3

  # NLP / Arabic processing
  - nltk=3.8.1
  - datasets=2.19.1
  - pyarabic=0.7.0
  - arabic-reshaper=3.0.0
  - python-bidi=0.4.2
  - wordcloud=1.9.3
  - stanza=1.8.2

  # Deep Learning
  - pytorch=2.3.1
  - torchvision=0.18.1
  - torchaudio=2.3.1
  - cudatoolkit=12.1

  # Pip-installed dependencies for compatibility
  - pip:
      - transformers==4.41.2
      - sentence-transformers==2.7.0
      - imbalanced-learn==0.12.3
      - xgboost==2.0.3
